# User facing features, rendered into the README (between the `features` markers) and the website by
# `scripts/build-docs.py`. `screenshot` names a file in docs/screenshots without extension; app screenshots are
# taken by android/app/src/androidTest/.../ScreenshotTest.kt, REAPER screenshots by scripts/docs-screenshots.sh.
# Adding a feature: add an entry here, a screenshot if it is visible, then `mise run docs`.
#
# [app] is the app store listing (F-Droid reads fastlane/metadata/android, which `mise run docs` generates from it
# and the features): the short description has at most 80 characters and no trailing dot.

[app]
intro = """
BandControl puts the band's REAPER on every band member's phone: playback and the setlist, input and front of house
levels, and a personal in-ear mix for each musician. Phones connect to the computer directly over Bluetooth, without
any network setup, and only phones paired with the computer can control it.
"""
needs = """
The app controls REAPER through the free BandControl extension for REAPER {min} or newer on Windows, macOS or Linux:
{website}
"""
short = "Control REAPER from your band's phones over Bluetooth: setlist, levels, in-ears"
title = "BandControl"

[[feature]]
id = "playback"
screenshot = "playback"
text = """
Play, pause, stop, record and repeat. The songs (regions) are listed in the band's order with their progress;
tap one to jump to it. Previous / next step through the parts of a song (markers) and continue with the next song
in the setlist.
"""
title = "Playback and setlist"

[[feature]]
id = "setlist"
screenshot = "setlist"
text = """
Tap Edit and drag songs by their handle, or long-press anywhere on a row, into tonight's order; switch a song off
to skip it. The order is stored in the REAPER project, and every phone sees the change.
"""
title = "Setlist order"

[[feature]]
id = "inputs"
screenshot = "inputs"
text = """
A meter for every input with its peak level, and a clip indicator that stays lit until you tap it. The fader sets
the input's gain (its track volume), up to +12 dB.
"""
title = "Input levels and gain"

[[feature]]
id = "foh"
screenshot = "foh"
text = """
The same meters and faders for the front of house outputs: the feeds to the house desk or straight to the PA.
"""
title = "FOH outputs"

[[feature]]
id = "iem"
screenshot = "iem"
text = """
Every band member picks their own mix and sets the level and mute of each source: click, backtracks, other
instruments, vocals, and the mix's overall level. Drag a fader sideways to move it; tapping or scrolling the list
leaves it alone. Changes made in REAPER show up on the phones.
"""
title = "Personal in-ear mixes"

[[feature]]
id = "pairing"
screenshot = "share"
text = """
REAPER shows a QR code; scan it with the app or type the code. A paired phone shows the same QR code to the next
one, so the rest of the band can pair from it. A phone can be paired with several computers, like a rehearsal
laptop and a stage PC: the app connects to the one in range and asks when both are.
"""
title = "Pairing by QR code"

[[feature]]
id = "bluetooth"
text = """
Phones connect to the computer directly over Bluetooth Low Energy, without a Wi-Fi network. Only paired phones find
the computer, and every session is encrypted. The app reconnects by itself and keeps the screen on while
connected.
"""
title = "Connectivity"
