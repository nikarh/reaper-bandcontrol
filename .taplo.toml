exclude = [".android-sdk/**", ".git/**", "android/**/build/**", "target/**"]
include = ["**/*.toml"]

[formatting]
align_comments        = true
align_entries         = true
column_width          = 120
compact_entries       = false
indent_tables         = false
reorder_arrays        = true
reorder_inline_tables = false
reorder_keys          = true
