allow-expect-in-tests           = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests            = true
allow-print-in-tests            = true
allow-unwrap-in-tests           = true
doc-valid-idents                = ["..", "BandControl"]
too-many-arguments-threshold    = 10

disallowed-types = [
  { path = "std::sync::Mutex", reason = "Use `parking_lot::Mutex` instead" },
  { path = "std::sync::RwLock", reason = "Use `parking_lot::RwLock` instead" },
]

disallowed-macros = [
  { path = "std::assert_eq", reason = "Use `pretty_assertions::assert_eq` instead", replacement = "pretty_assertions::assert_eq" },
  { path = "std::assert_ne", reason = "Use `pretty_assertions::assert_ne` instead", replacement = "pretty_assertions::assert_ne" },
]
