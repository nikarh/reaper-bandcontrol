# git-cliff configuration: https://git-cliff.org/docs/configuration
# Commits follow https://www.conventionalcommits.org; only user facing types end up in the changelog.

[changelog]
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first | trim }}\
            {% if commit.remote.username %} by @{{ commit.remote.username }}{%- endif -%}
            {% if commit.remote.pr_number %} in #{{ commit.remote.pr_number }}{%- endif -%}
    {% endfor %}
{% endfor %}\n
"""
footer = """
{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous and release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
                    /compare/{{ release.previous.version }}..{{ release.version }}
        {% endif -%}
    {% elif release.previous and release.previous.version -%}
        [unreleased]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
            /compare/{{ release.previous.version }}..HEAD
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""
header = """
# Changelog

All notable changes to this project are documented in this file. The format is based on
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), versions follow [Semantic Versioning](https://semver.org).\n
"""
trim = true

[git]
conventional_commits  = true
filter_unconventional = true
split_commits         = false
# Only the subject line.
commit_parsers = [
  { message = "^(test|chore|ci|build|style|refactor)", skip = true },
  { message = "^Release v", skip = true },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
]
commit_preprocessors = [{ pattern = "\n.*", replace = "" }]
filter_commits = true
sort_commits = "oldest"
tag_pattern = "v[0-9]*"

[remote.github]
owner = "nikarh"
repo  = "reaper-bandcontrol"
