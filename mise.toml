[tools]
actionlint                        = "1.7.12"
git-cliff                         = "2.14.2"
"github:EmbarkStudios/cargo-deny" = "0.20.2"
# GitHub CLI: repository setup, releases and secrets (SETUP.local.md, docs/RELEASING.md).
gh                           = "2.102.0"
gradle                       = "9.8.1"
"http:android-cmdline-tools" = { version = "16111833", url = "https://dl.google.com/android/repository/commandlinetools-linux-{{version}}_latest.zip", bin_path = "cmdline-tools/bin" }
java                         = "temurin-21.0.12+8.0.LTS"
rust                         = { version = "1.99.1", components = "rustfmt,clippy", targets = "x86_64-pc-windows-msvc,arm64ec-pc-windows-msvc,aarch64-apple-darwin,x86_64-apple-darwin" }
shellcheck                   = "0.11.0"
taplo                        = "0.10.0"

[env]
ANDROID_HOME     = "{{config_root}}/.android-sdk"
ANDROID_SDK_ROOT = "{{config_root}}/.android-sdk"
_.path           = ["{{config_root}}/.android-sdk/platform-tools"]

[tasks."android:sdk"]
description = "Install pinned Android SDK packages into .android-sdk"
run = """
yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null
sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" "cmdline-tools;latest"
"""

[tasks."android:emulator-sdk"]
description = "Install the Android emulator and a system image without Google services (for scripts/android-emulator.sh)"
run         = 'yes | sdkmanager --sdk_root="$ANDROID_HOME" "emulator" "system-images;android-35;default;x86_64"'

[tasks.fmt]
description = "Format everything"
run         = ["cargo fmt --all", "taplo fmt"]

[tasks.lint]
description = "Formatting, clippy (all desktop targets), cargo-deny"
run = [
  "cargo clippy --workspace --all-targets",
  "cargo clippy --workspace --target aarch64-apple-darwin",
  "cargo clippy --workspace --target x86_64-pc-windows-msvc",
  "cargo clippy -p reaper-bandcontrol --target arm64ec-pc-windows-msvc",
  "cargo deny check",
  "cargo fmt --all --check",
  "scripts/check-actions.sh",
  "shellcheck scripts/*.sh",
  "taplo fmt --check",
]

[tasks.test]
description = "Rust unit and integration tests (no Bluetooth, no REAPER)"
run         = "cargo test --workspace"

[tasks."e2e:reaper"]
description = "End-to-end tests against a real, isolated, headless REAPER (needs REAPER and cage or Xvfb)"
# One REAPER at a time: parallel instances under Xvfb interfere.
run = "cargo test -p reaper-harness -- --ignored --test-threads=1"


[tasks."e2e:reaper-versions"]
description = "REAPER e2e against several REAPER releases for Linux (args: versions, default the supported range)"
run         = "scripts/reaper-versions.sh"

[tasks."package:windows"]
description = "Windows installer (args: x64|arm64 [DLL] [OUTDIR]); signed when WINDOWS_SIGN_PFX is set; needs makensis"
run         = "scripts/package-windows.sh"

[tasks."package:macos"]
description = "macOS installer (args: [DYLIB] [OUTDIR]); signed and notarized when MACOS_* are set; needs macOS"
run         = "scripts/package-macos.sh"
[tasks.reaper]
description = "Run isolated REAPER with the extension; stdin lines go to the REAPER web interface (q quits)"
run         = "cargo run -q -p reaper-harness --"

[tasks."android:test"]
description = "Android JVM tests: protocol vs Rust vectors, state, Kotlin client vs Rust simulator"
dir         = "android"
# One command: taplo sorts arrays, and the simulator must be built first.
run = "cargo build -q -p bandctl && ./gradlew --console=plain :core:test"

[tasks."android:lint"]
description = "ktlint (spotless) and Android lint"
dir         = "android"
run         = "./gradlew --console=plain spotlessCheck :core:lint :app:lintDebug"

[tasks."android:fmt"]
description = "Format Kotlin sources"
dir         = "android"
run         = "./gradlew --console=plain spotlessApply"

[tasks."android:build"]
description = "Build debug and release APKs"
dir         = "android"
run         = "./gradlew --console=plain :app:assembleDebug :app:assembleRelease"

[tasks."android:deploy"]
description = "Install and start the app (args: [-s SERIAL] [pairing URL]; asks which device when several are connected)"
run         = "scripts/android-deploy.sh"

[tasks."android:e2e"]
description = "Instrumented end-to-end tests on the connected phone against bandctl sim (arg: tcp or ble)"
run         = "scripts/android-e2e.sh"

[tasks."android:e2e:reaper"]
description = "Instrumented end-to-end tests on the connected phone against headless REAPER (arg: ble or tcp)"
run         = "scripts/android-reaper-e2e.sh"

[tasks.install]
description = "Build the extension in release mode and install it into REAPER's UserPlugins (restart REAPER after)"
run         = "scripts/install-extension.sh"


[tasks.changelog]
description = "Regenerate CHANGELOG.md from the conventional commits"
run         = "git cliff -o CHANGELOG.md"

[tasks.docs]
description = "Regenerate the README feature section and build the website into target/site"
run         = ["python3 scripts/build-docs.py readme", "python3 scripts/build-docs.py site target/site"]

[tasks."docs:serve"]
description = "Build the website and serve it on http://localhost:8000"
# One command: taplo sorts arrays, which would serve before building.
run = "python3 scripts/build-docs.py site target/site && python3 -m http.server -b 127.0.0.1 -d target/site 8000"

[tasks."docs:screenshots"]
description = "Regenerate docs/screenshots (headless REAPER and the app on a phone or emulator)"
run         = "scripts/docs-screenshots.sh"
