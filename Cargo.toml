[workspace]
members  = ["crates/*"]
resolver = "3"

[workspace.package]
edition      = "2024"
license      = "MIT"
publish      = false
repository   = "https://github.com/nikarh/reaper-bandcontrol"
rust-version = "1.99"
version      = "0.1.2"

# The Android app's versionCode, written out (major * 10000 + minor * 100 + patch of the version above) because
# F-Droid reads it with a regular expression; scripts/bump-version.sh updates it and the Gradle build checks it.
[workspace.metadata.android]
version-code = 102

# The oldest REAPER the extension supports and the newest it is tested with. The extension, CI (the e2e tests run
# against both on every change), the scripts and the docs read them from here: raising either is one edit.
[workspace.metadata.reaper]
min    = "5.93"
tested = "7.82"

[profile.release]
codegen-units = 1
lto           = "fat"
strip         = true

[workspace.dependencies]
anyhow = "1.0.104"
bandcontrol-core = { path = "crates/bandcontrol-core" }
bandcontrol-proto = { path = "crates/bandcontrol-proto" }
bandcontrol-server = { path = "crates/bandcontrol-server" }
block2 = "0.6.2"
bluer = { version = "0.17.4", default-features = false, features = ["bluetoothd"] }
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
data-encoding = "2.11.1"
dispatch2 = { version = "0.3.1", default-features = false, features = ["alloc", "objc2"] }
futures = "0.3.34"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
nix = { version = "0.29.0", default-features = false, features = ["signal"] }
objc2 = "0.6.5"
objc2-core-bluetooth = { version = "0.3.2", default-features = false, features = [
  "CBATTRequest",
  "CBAdvertisementData",
  "CBAttribute",
  "CBCentral",
  "CBCharacteristic",
  "CBDescriptor",
  "CBError",
  "CBManager",
  "CBPeer",
  "CBPeripheralManager",
  "CBService",
  "CBUUID",
  "dispatch2",
  "std",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "NSArray",
  "NSBundle",
  "NSData",
  "NSDictionary",
  "NSError",
  "NSString",
  "NSUUID",
  "NSValue",
  "std",
] }
parking_lot = "0.12.5"
pretty_assertions = "1.4.1"
proptest = "1.12.0"
prost = "0.14.4"
prost-build = "0.14.4"
protox = "0.10.0"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
reaper-harness = { path = "crates/reaper-harness" }
rqrr = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = "1.28.0"
windows = { version = "0.62.2", features = [
  "Devices_Bluetooth",
  "Devices_Bluetooth_GenericAttributeProfile",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code                   = "deny"
unused_qualifications         = "deny"

[workspace.lints.clippy]
cargo                      = { level = "deny", priority = -1 }
complexity                 = { level = "deny", priority = -1 }
correctness                = { level = "deny", priority = -1 }
dbg_macro                  = "deny"
expect_used                = "deny"
indexing_slicing           = "deny"
missing_errors_doc         = "allow"
missing_panics_doc         = "allow"
module_name_repetitions    = "allow"
multiple_crate_versions    = "allow"
panic                      = "deny"
pedantic                   = { level = "deny", priority = -1 }
perf                       = { level = "deny", priority = -1 }
print_stderr               = "deny"
print_stdout               = "deny"
similar_names              = "allow"
struct_field_names         = "allow"
style                      = { level = "deny", priority = -1 }
suspicious                 = { level = "deny", priority = -1 }
todo                       = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented              = "deny"
unwrap_used                = "deny"
