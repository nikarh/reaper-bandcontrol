version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    rebase-strategy: "auto"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "cargo"
    directory: "/"
    rebase-strategy: "auto"
    schedule:
      interval: "weekly"
    allow:
      # Also bump transitive dependencies in Cargo.lock.
      - dependency-type: "all"
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "gradle"
    directory: "/android"
    rebase-strategy: "auto"
    schedule:
      interval: "weekly"
    groups:
      gradle-minor-patch:
        update-types: ["minor", "patch"]
