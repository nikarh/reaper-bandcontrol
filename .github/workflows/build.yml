name: Build

# Builds every release artifact; used by the Check and Publish workflows. The installers built here are unsigned:
# Publish builds them again with the signing certificates (and signs the APK with the release key).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  extension:
    name: Extension (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the library runs on older glibc versions too.
          - name: linux-x86_64
            os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
            file: libreaper_bandcontrol.so
            ext: so
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            targets: aarch64-unknown-linux-gnu
            file: libreaper_bandcontrol.so
            ext: so
          - name: macos-universal
            os: macos-15
            targets: aarch64-apple-darwin x86_64-apple-darwin
            file: libreaper_bandcontrol.dylib
            ext: dylib
          - name: windows-x86_64
            os: windows-2025
            targets: x86_64-pc-windows-msvc
            file: reaper_bandcontrol.dll
            ext: dll
          # REAPER for Windows on ARM is an ARM64EC build, so are its plugins.
          - name: windows-arm64ec
            os: windows-2025
            targets: arm64ec-pc-windows-msvc
            file: reaper_bandcontrol.dll
            ext: dll
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install BlueZ headers
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq libdbus-1-dev pkg-config
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.name }}
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          libs=()
          for target in ${{ matrix.targets }}; do
            cargo build --release --locked -p reaper-bandcontrol --lib --target "$target"
            libs+=("target/$target/release/${{ matrix.file }}")
          done
          out="dist/reaper_bandcontrol-${{ matrix.name }}.${{ matrix.ext }}"
          if [[ ${#libs[@]} -gt 1 ]]; then
            lipo -create -output "$out" "${libs[@]}"
          else
            cp "${libs[0]}" "$out"
          fi
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  windows-installers:
    name: Windows installers (unsigned)
    needs: [extension]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update -q && sudo apt-get install -yq nsis
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-windows-*
          merge-multiple: true
          path: dist
      - name: Package
        run: |
          scripts/package-windows.sh x64 dist/reaper_bandcontrol-windows-x86_64.dll installers
          scripts/package-windows.sh arm64 dist/reaper_bandcontrol-windows-arm64ec.dll installers
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-windows
          path: installers/*
          if-no-files-found: error

  macos-installer:
    name: macOS installer (unsigned)
    needs: [extension]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-macos-universal
          path: dist
      - run: scripts/package-macos.sh dist/reaper_bandcontrol-macos-universal.dylib installers
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-macos
          path: installers/*
          if-no-files-found: error

  apk:
    name: Android app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: java gradle http:android-cmdline-tools
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .android-sdk
          key: android-sdk-${{ hashFiles('mise.toml') }}
      - run: mise run android:sdk
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build
        working-directory: android
        run: |
          # Unsigned: Publish signs it with the release key (once, with apksigner).
          ./gradlew --console=plain :app:assembleRelease -Punsigned
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../dist/bandcontrol.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-android
          path: dist/*
          if-no-files-found: error
