name: Newest REAPER

# Weekly: the REAPER e2e tests against the newest REAPER on reaper.fm, so a REAPER update that breaks the extension
# shows up as an issue before users report it. When a newer release passes, a pull request raises the tested version
# in Cargo.toml (which the Check workflow then tests on every change); Auto-merge merges it once Check is green.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  e2e:
    name: REAPER e2e (latest release)
    if: github.repository_owner == 'nikarh'
    runs-on: ubuntu-24.04
    outputs:
      latest: ${{ steps.reaper.outputs.latest }}
      tested: ${{ steps.reaper.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Find the newest REAPER
        id: reaper
        run: |
          set -euo pipefail
          latest=$(scripts/reaper-version.sh latest)
          tested=$(scripts/reaper-version.sh tested)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          echo "Newest REAPER: $latest (tested in Check: $tested)" >> "$GITHUB_STEP_SUMMARY"
      - name: Install REAPER and a virtual display
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libdbus-1-dev pkg-config xvfb xdotool imagemagick \
            libgtk-3-0t64 libasound2t64 libxml2
          echo "REAPER_BIN=$(scripts/install-reaper.sh "$RUNNER_TEMP/reaper" "${{ steps.reaper.outputs.latest }}")" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: REAPER license, if the repository has one
        env:
          LICENSE: ${{ secrets.REAPER_LICENSE_BASE64 }}
        run: scripts/ci-reaper-license.sh install
      - id: e2e
        run: mise run e2e:reaper
        env:
          REAPER_HEADLESS: xvfb
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reaper-e2e-logs-latest
          path: target/reaper-e2e/**/*.log
      - name: Remove the REAPER license
        if: always()
        run: scripts/ci-reaper-license.sh remove
      - name: Report a failure
        if: failure() && steps.e2e.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.reaper.outputs.latest }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          scripts/report-issue.sh "REAPER $VERSION fails the end-to-end tests" \
            "The weekly run against REAPER $VERSION failed: $RUN (logs attached to the run)."

  raise:
    name: Raise the tested REAPER
    needs: e2e
    if: needs.e2e.outputs.latest != needs.e2e.outputs.tested
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Raise the version in Cargo.toml and the README
        env:
          VERSION: ${{ needs.e2e.outputs.latest }}
          TESTED: ${{ needs.e2e.outputs.tested }}
        run: |
          set -euo pipefail
          sed -i "/^\[workspace.metadata.reaper\]/,/^\[/s/^tested *= *\"$TESTED\"/tested = \"$VERSION\"/" Cargo.toml
          sed -i "s/ to ${TESTED//./\\.}\b/ to $VERSION/g" README.md
          [[ $(scripts/reaper-version.sh tested) == "$VERSION" ]]
          python3 scripts/build-docs.py check
      # A token of the app, not GITHUB_TOKEN: pull requests opened with GITHUB_TOKEN don't start the Check workflow.
      - name: Generate GitHub token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Open a pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          title: "test: test against REAPER ${{ needs.e2e.outputs.latest }}"
          commit-message: "test: test against REAPER ${{ needs.e2e.outputs.latest }}"
          body: REAPER ${{ needs.e2e.outputs.latest }} passed the weekly end-to-end tests, so Check tests it on every change from now on.
          branch: reaper-tested
          labels: auto-merge
          add-paths: |
            Cargo.toml
            README.md
          delete-branch: true
