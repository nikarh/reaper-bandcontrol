name: Docs

# Regenerates the screenshots (the app on an emulator against the simulated example project, and a headless REAPER)
# and the README feature section, and opens a pull request when anything changed. Merging it updates the website.
on:
  push:
    branches:
      - main
    paths:
      - android/app/src/main/**
      - android/app/src/androidTest/**/ScreenshotTest.kt
      - crates/*/src/**
      - tests/fixtures/**
      - docs/features.toml
      - scripts/docs-screenshots.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: true

env:
  REAPER_VERSION: "7.82"

jobs:
  screenshots:
    if: github.repository_owner == 'nikarh'
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v7
      - name: Install REAPER and a virtual display
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libdbus-1-dev pkg-config xvfb xdotool imagemagick \
            libgtk-3-0t64 libasound2t64 libxml2
          echo "REAPER_BIN=$(scripts/install-reaper.sh "$RUNNER_TEMP/reaper" "$REAPER_VERSION")" >> "$GITHUB_ENV"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: jdx/mise-action@v5
        with:
          install_args: rust java gradle http:android-cmdline-tools
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v5
        with:
          path: .android-sdk
          key: android-sdk-${{ hashFiles('mise.toml') }}
      - run: mise run android:sdk
      - uses: gradle/actions/setup-gradle@v6
      - name: REAPER screenshots
        run: scripts/docs-screenshots.sh reaper
        env:
          REAPER_HEADLESS: xvfb
          REAPER_LICENSE: ""
      - name: Build the app and the simulator
        run: |
          cargo build -q -p bandctl
          (cd android && ./gradlew --console=plain :app:assembleDebug :app:assembleDebugAndroidTest)
      - name: App screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: scripts/docs-screenshots.sh app
      - run: python3 scripts/build-docs.py readme
      - name: Generate GitHub token
        uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Open a pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.generate-token.outputs.token }}
          title: "docs: refresh screenshots"
          commit-message: "docs: refresh screenshots and README"
          body: Screenshots regenerated by the Docs workflow from the example project.
          branch: docs-refresh
          labels: docs
          add-paths: |
            docs/screenshots
            README.md
          delete-branch: true
