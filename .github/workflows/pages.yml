name: Site

# Builds the website from site/, docs/features.toml, docs/screenshots and CHANGELOG.md and deploys it to GitHub
# Pages (Settings → Pages → Source: GitHub Actions). No pages branch: the built site is uploaded directly.
on:
  push:
    branches:
      - main
    paths:
      - site/**
      - docs/**
      - CHANGELOG.md
      - Cargo.toml
      - scripts/build-docs.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: python3 scripts/build-docs.py site _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: [build]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
