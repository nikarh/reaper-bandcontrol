name: Create a release PR

permissions:
  pull-requests: write
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        description: Version update
        options:
          - patch
          - minor
          - major

jobs:
  release-pr:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Generate GitHub token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          install_args: rust git-cliff
      - id: bump
        name: Update version
        run: echo "version=$(scripts/bump-version.sh ${{ inputs.version }})" >> "$GITHUB_OUTPUT"
      - name: Update changelog and docs
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          git cliff --tag "v${{ steps.bump.outputs.version }}" -o CHANGELOG.md
          git cliff --tag "v${{ steps.bump.outputs.version }}" --unreleased --strip all -o "$RUNNER_TEMP/notes.md"
          python3 scripts/build-docs.py readme
          # The F-Droid listing, with what's new in this version (changelogs/<versionCode>.txt).
          python3 scripts/build-docs.py fastlane
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.generate-token.outputs.token }}
          title: Release v${{ steps.bump.outputs.version }}
          commit-message: Release v${{ steps.bump.outputs.version }}
          body-path: ${{ runner.temp }}/notes.md
          branch: release
          labels: release
          delete-branch: true
