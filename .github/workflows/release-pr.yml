name: Create a release PR

permissions:
  pull-requests: write
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        description: Version update
        options:
          - patch
          - minor
          - major

jobs:
  release-pr:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Generate GitHub token
        uses: actions/create-github-app-token@v3
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}
      - uses: jdx/mise-action@v5
        with:
          install_args: rust git-cliff
      - id: bump
        name: Update version
        run: echo "version=$(scripts/bump-version.sh ${{ inputs.version }})" >> "$GITHUB_OUTPUT"
      - name: Update changelog and docs
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          git cliff --tag "v${{ steps.bump.outputs.version }}" -o CHANGELOG.md
          git cliff --tag "v${{ steps.bump.outputs.version }}" --unreleased --strip all -o "$RUNNER_TEMP/notes.md"
          python3 scripts/build-docs.py readme
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.generate-token.outputs.token }}
          title: Release v${{ steps.bump.outputs.version }}
          commit-message: Release v${{ steps.bump.outputs.version }}
          body-path: ${{ runner.temp }}/notes.md
          branch: release
          labels: release
          delete-branch: true
