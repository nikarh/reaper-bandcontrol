name: Publish

# Builds, signs and uploads the release artifacts when a release is published, and for the `latest` pre-release when
# the Latest workflow calls it.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      version-suffix:
        description: Appended to the version from Cargo.toml, e.g. -dev+abc1234
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re)publish, e.g. v0.2.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}
  BANDCONTROL_VERSION_SUFFIX: ${{ inputs.version-suffix }}

jobs:
  build:
    name: Build
    # The Latest workflow creates the `latest` pre-release once and publishes it itself.
    if: github.repository_owner == 'nikarh' && github.event.release.tag_name != 'latest'
    uses: ./.github/workflows/build.yml
    with:
      version-suffix: ${{ inputs.version-suffix }}

  windows-installers:
    name: Windows installers
    needs: [build]
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - run: sudo apt-get update -q && sudo apt-get install -yq nsis osslsigncode
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-windows-*
          merge-multiple: true
          path: dist
      - name: Package and sign
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          # Without a certificate the installers are built unsigned, like in the Check workflow.
          if [[ -n $CERTIFICATE ]]; then
            echo "$CERTIFICATE" | base64 -d > "$RUNNER_TEMP/sign.pfx"
            export WINDOWS_SIGN_PFX=$RUNNER_TEMP/sign.pfx
            # The raw libraries get the same signature as the ones inside the installers.
            for dll in dist/*.dll; do scripts/sign-windows.sh "$dll"; done
          fi
          scripts/package-windows.sh x64 dist/reaper_bandcontrol-windows-x86_64.dll dist
          scripts/package-windows.sh arm64 dist/reaper_bandcontrol-windows-arm64ec.dll dist
          rm -f "$RUNNER_TEMP/sign.pfx"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-windows
          path: dist/*
          if-no-files-found: error

  macos-installer:
    name: macOS installer
    needs: [build]
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-macos-universal
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-macos-universal
          path: app
      - name: Import the signing certificates
        env:
          MACOS_CERTIFICATES_P12_BASE64: ${{ secrets.MACOS_CERTIFICATES_P12_BASE64 }}
          MACOS_CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
          MACOS_SELF_SIGNED_P12_BASE64: ${{ secrets.MACOS_SELF_SIGNED_P12_BASE64 }}
          MACOS_SELF_SIGNED_PASSWORD: ${{ secrets.MACOS_SELF_SIGNED_PASSWORD }}
        run: |
          if [[ -n $MACOS_CERTIFICATES_P12_BASE64 || -n $MACOS_SELF_SIGNED_P12_BASE64 ]]; then
            scripts/macos-keychain.sh
          fi
      - name: Package, sign and notarize
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          lib=dist/reaper_bandcontrol-macos-universal.dylib
          if [[ -n $MACOS_SIGN_IDENTITY ]]; then
            codesign --force --timestamp --options runtime --sign "$MACOS_SIGN_IDENTITY" "$lib"
          fi
          chmod +x app/BandControl-macos-universal
          scripts/package-macos.sh "$lib" app/BandControl-macos-universal dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-macos
          path: dist/*
          if-no-files-found: error

  upload:
    name: Sign and upload
    needs: [build, windows-installers, macos-installer]
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      # Signed libraries and installers replace the unsigned libraries from the build.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: signed-*
          merge-multiple: true
          path: dist
      - name: Sign the APK with the release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          # apksigner from build-tools 34: newer ones write signatures that F-Droid's apksigcopier can't verify, which
          # breaks reproducible builds (https://f-droid.org/docs/Reproducible_Builds/).
          tools=$ANDROID_HOME/build-tools/34.0.0
          if [[ ! -x $tools/apksigner ]]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" > /dev/null
          fi
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD dist/bandcontrol.apk
          "$tools/apksigner" verify --print-certs dist/bandcontrol.apk
          rm -f dist/*.idsig "$RUNNER_TEMP/release.keystore"
      - name: Import the signing key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Checksums and signature
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          gpg --batch --yes --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          cat SHA256SUMS
      - name: Generate GitHub token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: generate-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/* --clobber
          # Files a newer build no longer has (on `latest`, which is uploaded to again and again).
          gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
            [[ -e dist/$name ]] || gh release delete-asset "$TAG" "$name" --yes
          done
