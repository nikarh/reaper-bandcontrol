name: Auto-merge

# Merges green pull requests nobody needs to review: Dependabot's, and those the workflows open with the auto-merge
# label (the tested REAPER version from Newest REAPER).

on:
  workflow_run:
    workflows: ["Check"]
    types: [completed]
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # GITHUB_TOKEN cannot merge PRs that touch .github/workflows/ without this.
  actions: write

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  merge:
    name: Merge green automated PRs
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Merge green automated PRs
        env:
          # Optional fine-grained PAT (Contents + Pull requests + Workflows: write)
          # as a fallback if GITHUB_TOKEN is refused for workflow file changes.
          GH_TOKEN: ${{ secrets.DEPENDABOT_MERGE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          REQUIRED_CHECKS: |
            Lint
            Test
            REAPER e2e (oldest)
            REAPER e2e (newest)
            Android
            Build / Extension (linux-x86_64)
            Build / Extension (linux-aarch64)
            Build / Extension (macos-universal)
            Build / Extension (windows-x86_64)
            Build / Extension (windows-arm64ec)
            Build / Windows installers (unsigned)
            Build / macOS installer (unsigned)
            Build / Android app
        run: |
          set -euo pipefail

          prs=$(gh pr list --state open --base main \
            --json number,headRefOid,isDraft,mergeable,mergeStateStatus,author,labels)

          # Only bots' pull requests: a label alone is not enough.
          jq -c '.[] | select(.isDraft | not)
            | select(.author.login == "app/dependabot" or (.author.is_bot and any(.labels[]; .name == "auto-merge")))' <<<"$prs" | while IFS= read -r pr; do
            number=$(jq -r .number <<<"$pr")
            sha=$(jq -r .headRefOid <<<"$pr")
            mergeable=$(jq -r .mergeable <<<"$pr")
            state=$(jq -r .mergeStateStatus <<<"$pr")
            echo "::group::PR #$number ($sha, mergeable=$mergeable, state=$state)"

            if [[ "$mergeable" == "CONFLICTING" || "$state" == "DIRTY" ]]; then
              echo "Has conflicts; Dependabot and the workflows that opened it update it themselves."
              echo "::endgroup::"
              continue
            fi

            runs=$(gh api --paginate "repos/$GH_REPO/commits/$sha/check-runs?per_page=100" \
              --jq '.check_runs[] | {name, status, conclusion}' | jq -s .)

            missing=0
            while IFS= read -r check; do
              [[ -z "$check" ]] && continue
              if ! jq -e --arg n "$check" 'any(.[]; .name == $n)' <<<"$runs" >/dev/null; then
                echo "Required check '$check' has not reported yet."
                missing=1
              fi
            done <<<"$REQUIRED_CHECKS"

            pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
            failed=$(jq '[.[] | select(.status == "completed" and (.conclusion | IN("success", "neutral", "skipped") | not))] | length' <<<"$runs")
            statuses=$(gh api "repos/$GH_REPO/commits/$sha/status" --jq 'if .total_count == 0 then "success" else .state end')

            if (( missing || pending || failed )) || [[ "$statuses" != "success" ]]; then
              echo "Not ready: missing=$missing pending=$pending failed=$failed statuses=$statuses"
              echo "::endgroup::"
              continue
            fi

            echo "All checks green, merging."
            if gh pr merge "$number" --squash --match-head-commit "$sha"; then
              # Merges made with GITHUB_TOKEN don't trigger push workflows.
              gh workflow run check.yml --ref main
              gh workflow run pages.yml --ref main
            else
              echo "::warning::Failed to merge PR #$number"
            fi
            echo "::endgroup::"
          done
