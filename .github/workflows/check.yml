name: Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/ci-apt.sh libdbus-1-dev pkg-config
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: rust cargo-deny taplo shellcheck actionlint
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # fmt, clippy for Linux, macOS and Windows, cargo-deny, taplo, shellcheck, actionlint, docs up to date.
      - run: mise run lint

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/ci-apt.sh libdbus-1-dev pkg-config
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: mise run test

  reaper:
    name: REAPER e2e (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported and the newest tested REAPER, from [workspace.metadata.reaper] in Cargo.toml. The job
        # names don't contain the versions, so required checks stay the same when they change.
        include:
          - name: oldest
            version: min
          - name: newest
            version: tested
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: reaper
        run: |
          version=$(scripts/reaper-version.sh ${{ matrix.version }})
          echo "Testing REAPER $version" >> "$GITHUB_STEP_SUMMARY"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # REAPER's archive, so that the tests don't depend on reaper.fm answering.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/reaper-downloads
          key: reaper-${{ steps.reaper.outputs.version }}-linux-x86_64
      - name: Install REAPER and a virtual display
        env:
          REAPER_DOWNLOADS: ${{ runner.temp }}/reaper-downloads
        run: |
          scripts/ci-apt.sh libdbus-1-dev pkg-config xvfb xdotool imagemagick \
            libgtk-3-0t64 libasound2t64 libxml2
          echo "REAPER_BIN=$(scripts/install-reaper.sh "$RUNNER_TEMP/reaper" "${{ steps.reaper.outputs.version }}")" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: REAPER license, if the repository has one
        env:
          LICENSE: ${{ secrets.REAPER_LICENSE_BASE64 }}
        run: scripts/ci-reaper-license.sh install
      - run: mise run e2e:reaper
        env:
          REAPER_HEADLESS: xvfb
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reaper-e2e-logs-${{ matrix.name }}
          path: target/reaper-e2e/**/*.log
      - name: Remove the REAPER license
        if: always()
        run: scripts/ci-reaper-license.sh remove

  android:
    name: Android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/ci-apt.sh libdbus-1-dev pkg-config
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: rust java gradle http:android-cmdline-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .android-sdk
          key: android-sdk-${{ hashFiles('mise.toml') }}
      - run: mise run android:sdk
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # ktlint and Android lint.
      - run: mise run android:lint
      # Kotlin protocol and state tests, the Kotlin client against the Rust simulator.
      - run: mise run android:test

  macos:
    name: macOS (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Apple silicon on the newest macOS, Intel on an older one. The oldest supported macOS is
        # MACOSX_DEPLOYMENT_TARGET in .cargo/config.toml; there are no runners for it. No macos-14: GitHub often has no
        # runner for it at all, and the job fails without running. The job names don't contain the versions, so
        # required checks stay the same when the runners change.
        include:
          - name: newest
            os: macos-26
          - name: intel
            os: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.name }}
      # Everything but Bluetooth itself, which the runners don't have: the relay between the extension's server and
      # the app, CoreBluetooth and AppKit code compiled natively, the app started through Launch Services.
      - run: cargo test --workspace --locked
      - run: scripts/macos-app-e2e.sh
      - name: The app's log
        if: failure()
        run: cat ~/Library/Logs/BandControl.log || true

  build:
    name: Build
    uses: ./.github/workflows/build.yml
